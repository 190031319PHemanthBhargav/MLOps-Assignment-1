name: MLOps CI/CD pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-train:
    name: Build, Test, and Train model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8==7.1.2

      - name: Lint Python source
        run: |
          python -m flake8 train.py verify_packaging.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 train.py verify_packaging.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Train and verify model package
        run: python train.py

      - name: Run pytest suite
        run: |
          mkdir -p test-reports
          python -m pytest tests/ -v --junitxml=test-reports/junit.xml --maxfail=1 --disable-warnings -q

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: trained-model-pipeline
          path: |
            model.pkl
            model_metadata.json
            cv_model_comparison.csv
            mlruns/
          retention-days: 7

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-execution-logs
          path: test-reports/
          retention-days: 7