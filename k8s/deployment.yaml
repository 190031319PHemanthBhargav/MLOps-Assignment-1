apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-prediction
  labels:
    app: heart-disease-api

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: heart-disease-api
  template:
    metadata: 
      labels:
        app: heart-disease-api
    spec:
      containers:
        - name: api
          image: heart-disease-prediction:v2
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "200m"
              memory: "128Mi"